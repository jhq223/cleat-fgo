[package]
name = "cleat-fgo"
version = "0.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
cleat = { path = "../cleat", features = ["unity-6000"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simple-rijndael = "0.3"
flate2 = "1.0"
arc-swap = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.11"
tempfile = "3"
regex = "1"
semver = "1"
hex = "0.4"
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
